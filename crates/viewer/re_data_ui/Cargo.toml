[package]
authors.workspace = true
description = "Provides ui elements for Rerun component data for the Rerun Viewer."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_data_ui"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[dependencies]
re_arrow_ui.workspace = true
re_capabilities = { path = "../re_capabilities", default-features = false, features = ["egui"] }
re_chunk_store.workspace = true
re_entity_db.workspace = true
re_format.workspace = true
re_log.workspace = true
re_log_channel.workspace = true
re_log_types.workspace = true
re_query.workspace = true
re_renderer.workspace = true
re_sdk_types = { path = "../re_sdk_types", default-features = false, features = [
  "egui_plot", # Needed to draw marker shapes.
] }
re_sorbet.workspace = true
re_tracing.workspace = true
re_types_core.workspace = true
re_ui.workspace = true
re_uri.workspace = true
re_video = { path = "../re_video", default-features = false, optional = true, features = ["ffmpeg"], optional = true }
re_viewer_context.workspace = true

ahash.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
egui.workspace = true
itertools.workspace = true
jiff.workspace = true
rexif.workspace = true
unindent.workspace = true

[features]
default = []
video = ["dep:re_video", "re_viewer_context/video", "re_renderer/video"]
